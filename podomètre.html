<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generateur de Direction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            text-align: center;
        }

        button {
            font-size: 16px;
            padding: 10px 20px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="direction">Cliquez pour générer une direction</h1>
        <button onclick="generateDirection()">Générer</button>
    </div>
    <script>
        function generateDirection() {
            const directions = ['Droite', 'Gauche', 'Tout droit', 'En arrière'];
            const randomIndex = Math.floor(Math.random() * directions.length);
            const randomDirection = directions[randomIndex];
            document.getElementById('direction').innerText = randomDirection;
        }
    </script>
</body>
</html>
